<script type="module">

const $ = s => document.querySelector(s);
const $$ = s => Array.from(document.querySelectorAll(s));
const SK_TOKEN = 'jwt_token_v1';

const MAX_DEBTS = 2000;

  const SCOPED_TABLES = ['products', 'customers', 'orders', 'logs', 'public_requests', 'customer_accounts', 'stock_receipts'];

const getToken = () => localStorage.getItem(SK_TOKEN) || '';
const setToken = (t) => localStorage.setItem(SK_TOKEN, t);

async function apiCall(action, payload) {
  const headers = { 'Content-Type': 'application/json' };
  const t = getToken();
  if (t) headers['Authorization'] = 'Bearer ' + t;
  const r = await fetch('/api/db', { method: 'POST', headers, body: JSON.stringify({ action, payload }) });
  let j; try { j = await r.json(); } catch (e) { throw new Error('استجابة غير صحيحة من الخادم'); }
  if (!r.ok) throw new Error(j.error || 'خطأ في API');
  return j;
}
async function apiSQL(text, params) {
  const headers = { 'Content-Type': 'application/json' };
  const t = getToken();
  if (t) headers['Authorization'] = 'Bearer ' + t;
  const r = await fetch('/api/db', { method: 'POST', headers, body: JSON.stringify({ sql: text, params: params || [] }) });
  let j; try { j = await r.json(); } catch (e) { throw new Error('استجابة غير صحيحة من الخادم'); }
  if (!r.ok) throw new Error(j.error || 'خطأ في الاستعلام');
  return j.data;
}

function createSQLShim() {
  function serialize(v) { if (v === null || v === undefined) return null; if (Array.isArray(v) || (typeof v === 'object')) return JSON.stringify(v); return v; }
  function deserializeRow(row) {
    if (!row || typeof row !== 'object') return row;
    const out = {};
    for (const k in row) {
      const v = row[k];
      if (typeof v === 'string' && v.length > 1 && (v[0] === '[' || v[0] === '{')) {
        try { out[k] = JSON.parse(v); } catch (e) { out[k] = v; }
      } else out[k] = v;
    }
    return out;
  }
  class QB {
    constructor(table) { this.table = table; this.filters = []; this.orderBy = null; this.limitN = null; this.singleMode = null; this.mode = 'select'; this.selectCols = '*'; this.insertData = null; this.updateData = null; this.returning = false; }
    select(c = '*') { if (this.mode === 'insert' || this.mode === 'update') this.returning = true; else { this.mode = 'select'; this.selectCols = c; } return this; }
    insert(d) { this.mode = 'insert'; this.insertData = Array.isArray(d) ? d : [d]; return this; }
    update(d) { this.mode = 'update'; this.updateData = d; return this; }
    delete() { this.mode = 'delete'; return this; }
    eq(c, v) { this.filters.push({ op: '=', c, v }); return this; }
    neq(c, v) { this.filters.push({ op: '<>', c, v }); return this; }
    gt(c, v) { this.filters.push({ op: '>', c, v }); return this; }
    gte(c, v) { this.filters.push({ op: '>=', c, v }); return this; }
    lt(c, v) { this.filters.push({ op: '<', c, v }); return this; }

async function runAutoClean() {
  if (!invData) return;
  const key = 'autoclean_' + invData.id;
  const lastRun = Number(localStorage.getItem(key) || 0);
  const now = Date.now();
  if (now - lastRun < 24 * 60 * 60 * 1000) return;
  try {
    const logCutoff = new Date(now - LOG_RETENTION_DAYS * 86400000).toISOString();
    await sb.from('logs').delete().eq('inv_id', invData.id).lt('created_at', logCutoff);

    const orderCutoff = new Date(now - ORDER_RETENTION_DAYS * 86400000).toISOString();
    for (const p of ['cash', 'bank']) {
      await sb.from('orders').delete().eq('inv_id', invData.id).eq('payment', p).lt('created_at', orderCutoff);
    }
    await sb.from('orders').delete().eq('inv_id', invData.id).eq('payment', 'later').eq('paid', true).lt('created_at', orderCutoff);

    const requestCutoff = new Date(now - REQUESTS_RETENTION_DAYS * 86400000).toISOString();
    await sb.from('public_requests').delete().eq('inv_id', invData.id).lt('created_at', requestCutoff);

    localStorage.setItem(key, String(now));
  } catch (e) { console.error('Auto-clean error:', e); }
}

function quoteCalc() {
  let sub = 0;
  $$('#qItems .oi').forEach(r => { sub += (+r.querySelector('.oi-q').value || 0) * (+r.querySelector('.oi-p').value || 0); });
  const disc = +($('#qDiscount') ? $('#qDiscount').value : 0) || 0;
  const rate = +($('#qTaxRate') ? $('#qTaxRate').value : 0) || 0;
  const afterDisc = Math.max(0, sub - disc);
  const tax = afterDisc * rate / 100;
  const total = afterDisc + tax;
  const s = $('#qSubtotal'); if (s) s.textContent = mn(sub);
  const t = $('#qTotal'); if (t) t.textContent = mn(total);
}
async function quoteSave() {
  const rows = $$('#qItems .oi');
  const items = [];
  for (const r of rows) {
    const pid = r.querySelector('.ps-i').value;
    const q = +r.querySelector('.oi-q').value || 0;
    const pr = +r.querySelector('.oi-p').value || 0;
    if (!pid || q <= 0) continue;
    const p = invData.products.find(x => x.id === pid);
    if (!p) continue;
    items.push({ productId: p.id, name: p.name, qty: q, price: pr, total: q * pr });
  }
  if (!items.length) return alert('أضف صنفًا واحدًا على الأقل');
  let cid = null, cn = '', cp = '';
  const sl = $('#qC').value;
  if (sl === '__new') {
    cn = ($('#qNn').value || '').trim();
    cp = ($('#qNp').value || '').trim();
    if (!cn) return alert('اكتب اسم الزبون');
  } else if (sl) {
    const c = invData.customers.find(x => x.id === sl);
    if (c) { cid = c.id; cn = c.name; cp = c.phone || ''; }
  }
  const subtotal = items.reduce((s, i) => s + i.total, 0);
  const discount = +($('#qDiscount') ? $('#qDiscount').value : 0) || 0;
  const taxRate = +($('#qTaxRate') ? $('#qTaxRate').value : 0) || 0;
  const afterDisc = Math.max(0, subtotal - discount);
  const taxAmount = afterDisc * taxRate / 100;
  const total = afterDisc + taxAmount;
  const notes = ($('#qNotes') ? $('#qNotes').value : '').trim();
  const validUntil = ($('#qValid') ? $('#qValid').value : '') || null;
  const count = quotes.length + 1;

  win.document.close();

  function tlv(tag, value) {
    const enc = new TextEncoder().encode(String(value));
    const out = [tag, enc.length];
    for (let i = 0; i < enc.length; i++) out.push(enc[i]);
    return out;
  }
  const bytes = [
    ...tlv(1, sellerName || ''),
    ...tlv(2, vatNumber || ''),
    ...tlv(3, timestamp || ''),
    ...tlv(4, total.toFixed(2)),
    ...tlv(5, vatTotal.toFixed(2))
  ];
  let binary = '';
  for (let i = 0; i < bytes.length; i++) binary += String.fromCharCode(bytes[i]);
  return btoa(binary);
}

async function orderToInvoice(oid) {
  const o = invData.orders.find(x => x.id === oid); if (!o) return;
  if (!invData.invoiceEnabled) return alert('⚠️ الفواتير الضريبية غير مفعّلة لهذا المخزون. تواصل مع الأدمن.');
  if (!confirm('إنشاء فاتورة ضريبية لهذا الطلب؟')) return;
  const count = quotes.filter(q => q.type === 'invoice').length + 1;
  const number = 'INV-' + String(count).padStart(4, '0');
  const items = o.items.map(i => ({ productId: i.productId, name: i.name, qty: i.qty, price: i.price, total: i.qty * i.price }));
  const subtotal = items.reduce((s, i) => s + i.total, 0);
  const taxRate = 15;
  const taxAmount = subtotal * taxRate / 100;
  const total = subtotal + taxAmount;
  ld();
  try {
    const nid = uid();
    const r = await sb.from('invoices').insert({ id: nid, inv_id: invData.id, invoice_type: 'invoice', invoice_number: number, customer_name: o.customerName, customer_phone: '', items, subtotal, discount: 0, tax_rate: taxRate, tax_amount: taxAmount, total, notes: o.note || '', status: 'draft', user_name: session.user }).select().single();
    if (r.error) throw new Error(r.error.message);
    quotes.unshift(mQ(r.data));
    await log('فاتورة ضريبية', o.customerName + ' | ' + number);
    ul(); alert('✅ تم إنشاء الفاتورة ' + number); quoteView(nid);
  } catch (e) { ul(); alert('خطأ: ' + (e.message || e)); }
}
function uploadLogo(e) {
  const f = e.target.files[0]; if (!f) return;
  if (f.size > 500 * 1024) return alert('حجم الصورة أكبر من 500KB');
  const reader = new FileReader();
  reader.onload = function(ev) {
    invData.logoBase64 = ev.target.result;
    renderTab();
  };
  reader.readAsDataURL(f);
}
function removeLogo() {
  if (!confirm('حذف الشعار؟')) return;
  invData.logoBase64 = '';
  renderTab();
}
async function saveBusinessInfo() {
  const name = ($('#bizName') ? $('#bizName').value : '').trim();
  const phone = ($('#bizPhone') ? $('#bizPhone').value : '').trim();
  const address = ($('#bizAddress') ? $('#bizAddress').value : '').trim();
  const vat = ($('#bizVat') ? $('#bizVat').value : '').trim();
  const footer = ($('#bizFooter') ? $('#bizFooter').value : '').trim();
  const color = ($('#bizColor') ? $('#bizColor').value : '#2563eb');
  const showLogo = ($('#bizShowLogo') ? $('#bizShowLogo').checked : true);
  ld();
  try {
    const r = await sb.from('inventories').update({ business_name: name, business_phone: phone, business_address: address, invoice_footer: footer, vat_number: vat, invoice_color: color, invoice_show_logo: showLogo, logo_base64: invData.logoBase64 || '' }).eq('id', invData.id);
    if (r.error) throw new Error(r.error.message);
    invData.businessName = name;
    invData.businessPhone = phone;
    invData.businessAddress = address;
    invData.invoiceFooter = footer;
    invData.vatNumber = vat;
    invData.invoiceColor = color;
    invData.invoiceShowLogo = showLogo;
    await log('تعديل بيانات النشاط', name);
    ul(); alert('✅ تم حفظ بيانات النشاط'); renderTab();
  } catch (e) { ul(); alert('خطأ: ' + (e.message || e)); }
}
async function saveDispName() {
  const n = ($('#dispName') ? $('#dispName').value : '').trim();
  if (!n) return alert('اكتب الاسم');
  ld();
  try {
    const r = await sb.from('inventories').update({ display_name: n }).eq('id', invData.id);
    if (r.error) throw new Error(r.error.message);
    invData.displayName = n;
    $('#invT').textContent = n;
    await log('تغيير الاسم', n);
    ul(); alert('✅ تم حفظ الاسم'); renderTab();
  } catch (e) { ul(); alert('خطأ: ' + (e.message || e)); }
}
